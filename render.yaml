services:
  - type: web
    name: revzenta-crm
    runtime: bun
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: true
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RENTCAST_API_KEY
        sync: false
      - key: ATTOM_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
